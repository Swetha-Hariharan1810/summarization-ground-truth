[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtgen"
version = "0.1.0"
description = "Low-hallucination ground truth generation for call summarization training labels"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "jsonschema>=4.20",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gtgen = "gtgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gtgen = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
